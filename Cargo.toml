[package]
name = "nexnwatch"
version = "0.1.0"
edition = "2024"
description = "NexNWatch - Windows real-time network monitoring and process traffic analysis"
authors = ["NexOrigin"]
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sysinfo = "0.39"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1"
