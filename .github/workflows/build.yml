name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Problem matcher: rustc/clippy hataları PR'da satır açıklaması olarak görünür
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Biçim
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: Hız testi (gerçek ağ)
        run: |
          for p in auto cloudflare ookla; do
            out=$(cargo run -q -- --speedtest $p 2>/dev/null | tr '\n' ' ')
            echo "::notice title=speedtest linux $p::$out"
          done

  windows:
    name: Windows release + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Clippy (Windows'a özgü kod dahil)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: Hız testi (gerçek ağ, release exe)
        shell: pwsh
        run: |
          foreach ($p in 'auto','cloudflare','ookla') {
            $out = (& .\target\release\nexnwatch.exe --speedtest $p | Out-String) -replace '\r?\n',' '
            Write-Output "::notice title=speedtest windows $p::$out"
          }

      - name: LAN testi (release exe, gerçek SMB paylaşımı)
        shell: pwsh
        run: |
          $exe = ".\target\release\nexnwatch.exe"
          $srv = Start-Process -FilePath $exe -ArgumentList '--lan-server','120' -PassThru
          Start-Sleep -Seconds 3
          foreach ($m in 'bidir','up','down') {
            $out = (& $exe --lan-test 127.0.0.1 $m 3 4 | Out-String) -replace '\r?\n',' '
            Write-Output "::notice title=lan tcp $m::$out"
          }
          $out = (& $exe --lan-test 127.0.0.1 udp 3 1 200 | Out-String) -replace '\r?\n',' '
          Write-Output "::notice title=lan udp 200::$out"
          New-Item -ItemType Directory -Force C:\nnwshare | Out-Null
          New-SmbShare -Name nnw -Path C:\nnwshare -FullAccess Everyone | Out-Null
          $out = (& $exe --share-test '\\localhost\nnw' 256 | Out-String) -replace '\r?\n',' '
          Write-Output "::notice title=lan smb::$out"
          $left = (Get-ChildItem C:\nnwshare).Count
          Write-Output "::notice title=lan smb cleanup::kalan dosya: $left"
          $rule = (netsh advfirewall firewall show rule name="NexNWatch LAN Testi" | Out-String) -replace '\r?\n',' '
          Write-Output "::notice title=lan firewall::$rule"
          Stop-Process -Id $srv.Id -Force

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\nexnwatch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target\release\nexnwatch.exe, README.md -DestinationPath "dist\NexNWatch-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: nexnwatch-windows-x64
          path: target/release/nexnwatch.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nexnwatch-setup
          path: dist/*

      # main'e push → Cargo.toml sürümü için Release (etiket yoksa oluşturulur);
      # v* etiketi elle atılırsa da aynı şekilde yayınlanır.
      - name: GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NexNWatch ${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
